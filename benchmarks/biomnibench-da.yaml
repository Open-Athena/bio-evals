    notes:
      - "Access: Authenticated access and task execution succeeded for the gated 50-task release,
        pinned to e1c8ca5e11a620087bc48d97888eb69176a1f235. Distinguish this release from the
        paper's 100-task suite."
      - "Grading: The adapter preserves task rubrics and grading prompts but uses a configurable
        Together judge, validated with GPT-OSS-120B, and applies signed source-reliability penalties
        dropped by the released parser. Development controls exercised good, wrong, and empty
        submissions; these do not establish general agreement with human scientific review."
      - "Inputs: Native inputs remain the default. The Pi evaluation used disclosed reductions for
        five tasks: omit the unused CRC expression matrix for two tasks and retain all cells, raw
        counts, and metadata while removing the separate normalized lupus matrix for three tasks."
      - "Runtime limitations: Ortet-inference #2 remains open for tokenization compatibility with
        the GLM endpoint; successful Pi validation used a historical Harbor runtime. Harbor #261
        remains open for Pi timeout cleanup and report capture. Six Pi tasks remain ungraded, and
        two graded timeout submissions have uncertain timing."
      - "Historical runtime issue: Harbor #165 is closed; compaction failures and incomplete usage
        accounting affected earlier Terminus runs. Closure does not retroactively validate or
        change those grades. These service and harness issues are separate from adapter acceptance."
