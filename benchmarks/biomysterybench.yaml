    notes:
      - "Access: 90 gated, evaluation-only tasks. Conversion preserves questions, inputs, rubrics, attribution and domain restrictions from a pinned release; benchmark material and evaluation artifacts remain outside Git and training data."
      - "Grading: Protocol v8 uses Together DeepSeek V4.1 Flash to judge the answer, rubric and recorded tool-call names and arguments together. Reward requires correctness and no prohibited source lookup. Missing answers score zero when transcript collection succeeds; missing or oversized transcripts, context rejection, judge failures and recorded artifact-writer failures remain unscored."
      - "Protocol limitations: Tool results and reasoning are omitted from judge input, so prohibited retrieval hidden in scripts or responses may escape detection; full transcripts remain archived. Scoring parity with the report's protocol is unverified."
      - "Coverage: 83/90 tasks were graded, with seven storage-heavy tasks unrun and no grades pending. The development aggregate includes environment additions and one larger-output-budget judge-only recovery. It does not establish full-suite coverage, base-image support for every evaluated task, or held-out performance. No reduced-input benchmark variant was used."
