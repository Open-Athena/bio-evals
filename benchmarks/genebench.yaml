        assessment:
          checked_at: 2026-10-15
          reason: "Public-10 adapter PR #164 merged on October 15, 2026, and registration issue #163 is closed. End-to-end validation covers all ten released cases with the unchanged official grader and solver/reference isolation. Implementation covers this public subset, not the full 129-task GeneBench-Pro suite or original private GeneBench."
          sources:
            - label: Completed registration and validation record
              url: https://github.com/marin-community/harbor/issues/163
            - label: Merged implementation PR
              url: https://github.com/marin-community/harbor/pull/164
    work:
      - https://github.com/marin-community/harbor/pull/164
      - https://github.com/marin-community/harbor/issues/163
    notes:
      - "Access: Ten ungated public cases with references and schemas; full 129-task suite not in
        release."
      - "Grading: Unchanged official deterministic grader; its passed field maps to binary reward while score and field diagnostics are retained. Missing or invalid submissions receive classified zero rewards; grader failures remain errors. Forty native-grader contract checks and nine adapter tests passed as reported in the merged PR."
      - "Limitations: the public package is a ten-case subset of the full 129-task suite; do not
        equate public-subset coverage with full-suite implementation."
      - "Protocol: Answers are written to /app/result.json in an offline scientific environment. Validation used one attempt per case with a two-hour limit; response-format failures are included rather than excluded as in the paper. The public-answer validation is diagnostic, not a full hidden-benchmark result."
    provenance:
